{% extends 'base.html' %}
{% load static %}

{% block title %}Resume | Wajiha Rubab{% endblock %}

{% block extra_css %}
<style>
    .resume-page-wrapper {
        width: 100%;
        min-height: calc(100vh - 80px);
        margin-top: 80px;
        padding: 30px 6% 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
    }

    .resume-container {
        width: 100%;
        max-width: 850px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .resume-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--text-main, #f3f4f6);
        text-align: center;
        margin-bottom: 25px;
        letter-spacing: -0.5px;
    }

    .resume-title span {
        color: var(--accent-blue, #00d2ff);
    }

    /* Glassmorphic Neon Dark Card */
    .resume-card {
        width: 100%;
        background: rgba(17, 24, 39, 0.85);
        border: 1px solid rgba(0, 210, 255, 0.25);
        border-radius: 16px;
        padding: 24px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 210, 255, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        box-sizing: border-box;
    }

    /* PDF Wrapper / Viewport */
    .pdf-container {
        position: relative;
        width: 100%;
        height: 1050px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background-color: #0f172a;
    }

    .pdf-frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: #1e293b;
    }

    /* Mobile Resume Image View (Default hidden on desktop) */
    .resume-mobile-img {
        display: none;
        width: 100%;
        height: auto;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        object-fit: contain;
        background: #1e293b;
    }

    /* Download Button */
    .resume-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding-top: 5px;
    }

    .btn-download-primary {
        background-color: var(--accent-blue, #00d2ff);
        color: #0a0e1a;
        font-size: 0.95rem;
        font-weight: 700;
        padding: 12px 30px;
        border-radius: 30px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    .btn-download-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
        background-color: #33dcfd;
    }

    /* Responsive for Mobiles: Hide iframe, Show Image */
    @media (max-width: 768px) {
        .resume-page-wrapper {
            margin-top: 65px;
            padding: 15px 4% 40px;
        }
        .pdf-container {
            display: none !important; /* Hide iframe on mobile */
        }
        .resume-mobile-img {
            display: block !important; /* Show clean image page on mobile */
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="resume-page-wrapper">
    <div class="resume-container">
        <h1 class="resume-title">Curriculum Vitae<span>.</span></h1>

        <div class="resume-card">
            <!-- Desktop View: PDF Iframe -->
            <div class="pdf-container">
                <iframe src="{% static 'Resume.pdf' %}#toolbar=0&navpanes=0&scrollbar=0&view=FitH" class="pdf-frame"></iframe>
            </div>

            <!-- Mobile View: Clean Resume Page Image -->
            <!-- Mobile View: Clean Resume Page Image -->
<img src="{% static 'resume.png' %}" alt="Wajiha Rubab Resume" class="resume-mobile-img">

            <div class="resume-actions">
                <a href="{% static 'Resume.pdf' %}" download class="btn-download-primary">
                    <i class="fas fa-download"></i> Download Resume PDF
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
