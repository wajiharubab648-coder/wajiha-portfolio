{% extends 'base.html' %}
{% load static %}

{% block title %}Resume | Wajiha Rubab{% endblock %}

{% block extra_css %}
<style>
    .resume-page-wrapper {
        width: 100%;
        min-height: calc(100vh - 80px);
        margin-top: 80px;
        padding: 20px 6% 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        box-sizing: border-box;
    }

    .resume-container {
        width: 100%;
        max-width: 820px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .resume-title {
        font-family: 'Instrument Serif', serif;
        font-size: 2.6rem;
        font-weight: 400;
        color: var(--text-main, #f3f4f6);
        text-align: center;
        margin-bottom: 20px;
        letter-spacing: 1px;
    }

    .resume-title span {
        color: var(--accent-blue, #00d2ff);
    }

    /* Glassmorphic Neon Dark Card */
    .resume-card {
        width: 100%;
        background: rgba(17, 24, 39, 0.75);
        border: 1px solid rgba(0, 210, 255, 0.25);
        border-radius: 16px;
        padding: 16px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 210, 255, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    /* PDF Wrapper to Enable Custom Cursor Over PDF */
    .pdf-container {
        position: relative;
        width: 100%;
        height: 1120px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background-color: #ffffff;
    }

    .pdf-frame {
        width: 100%;
        height: 100%;
        border: none;
        pointer-events: none;
    }

    /* Actions Bar - Single Centered Button */
    .resume-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding-top: 4px;
    }

    .btn-download-primary {
        background-color: var(--accent-blue, #00d2ff);
        color: #0a0e1a;
        font-size: 0.9rem;
        font-weight: 700;
        padding: 11px 28px;
        border-radius: 30px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    .btn-download-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
        background-color: #33dcfd;
    }
</style>
{% endblock %}

{% block content %}
<div class="resume-page-wrapper">
    <div class="resume-container">
        <h1 class="resume-title">Curriculum Vitae<span>.</span></h1>

        <div class="resume-card">
            <div class="pdf-container">
                <iframe src="{% static 'Resume.pdf' %}#toolbar=0&navpanes=0&scrollbar=0&view=FitH" class="pdf-frame"></iframe>
            </div>

            <div class="resume-actions">
                <a href="{% static 'Resume.pdf' %}" download class="btn-download-primary">
                    <i class="fas fa-download"></i> Download Resume
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
