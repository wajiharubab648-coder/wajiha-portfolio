{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<!-- Cropper.js CSS & JS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<style>
  #crop-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    align-items: center; justify-content: center;
  }
  .modal-content {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    max-width: 500px;
    width: 90%;
    text-align: center;
  }
  .img-container {
    max-height: 350px;
    margin-bottom: 15px;
  }
  .crop-btn {
    background: #22D3C3;
    color: #0A2A66;
    border: none;
    padding: 10px 20px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
  }
</style>
{% endblock %}

{% block content %}
{{ block.super }}

<!-- Crop Modal Box -->
<div id="crop-modal">
  <div class="modal-content">
    <h3>Adjust Profile Picture</h3>
    <div class="img-container">
      <img id="image-to-crop" src="" style="max-width: 100%;">
    </div>
    <button type="button" id="crop-and-apply" class="crop-btn">Apply & Save</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const fileInput = document.querySelector('input[type="file"][name="profile_pic"]');
    if (!fileInput) return;

    const modal = document.getElementById('crop-modal');
    const imageToCrop = document.getElementById('image-to-crop');
    const cropBtn = document.getElementById('crop-and-apply');
    let cropper = null;

    fileInput.addEventListener('change', function (e) {
        const files = e.target.files;
        if (files && files.length > 0) {
            const file = files[0];
            const reader = new FileReader();
            reader.onload = function (evt) {
                imageToCrop.src = evt.target.result;
                modal.style.display = 'flex';

                if (cropper) {
                    cropper.destroy();
                }

                cropper = new Cropper(imageToCrop, {
                    aspectRatio: 1, // Square crop for circular display
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 0.8,
                    restore: false,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                });
            };
            reader.readAsDataURL(file);
        }
    });

    cropBtn.addEventListener('click', function () {
        if (!cropper) return;

        // Canvas se cropped image hasil karein
        const canvas = cropper.getCroppedCanvas({
            width: 400,
            height: 400
        });

        canvas.toBlob(function (blob) {
            // File input data replace karein
            const croppedFile = new File([blob], "profile_cropped.jpg", { type: "image/jpeg" });
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(croppedFile);
            fileInput.files = dataTransfer.files;

            modal.style.display = 'none';
            cropper.destroy();
        }, 'image/jpeg');
    });
});
</script>
{% endblock %}
